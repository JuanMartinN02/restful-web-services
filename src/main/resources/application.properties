spring.application.name=restful-web-services

springdoc.enable-hateoas=false
springdoc.enable-spring-data-rest=false

spring.mvc.apiversion.use.path-segment=0
spring.mvc.apiversion.use.query-parameter=version

spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.defer-datasource-initialization=true